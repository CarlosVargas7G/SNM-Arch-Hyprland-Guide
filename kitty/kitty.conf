# Kitty configuration
# font_family MesloLGS Nerd Font
font_size 12.0

enable_audio_bell no

cursor_shape block
cursor_blink_interval 0


# BEGIN_KITTY_FONTS
font_family      family='MesloLGS Nerd Font' postscript_name=MesloLGSNF-Regular
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS
shell /usr/bin/zsh
