# ============================================================
# SNM Hyprlock
# Compatible con Hyprlock 0.9.6
# ============================================================

$fontFamily = Atkinson Hyperlegible

general {
    disable_loading_bar = true
    hide_cursor = true
    no_fade_in = true
    no_fade_out = true
    ignore_empty_input = true
    fractional_scaling = 1
}

# ============================================================
# FONDO
# ============================================================

background {
    path = $HOME/Pictures/wallpapers/fondooo.jpg
    fit_mode = contain
    color = rgba(00000000)

    blur_passes = 1
    blur_size = 3
}

# ============================================================
# USUARIO
# ============================================================

label {
    text = $USER

    color = rgba(b4befeff)

    font_size = 24
    font_family = $fontFamily Bold

    position = 0, -15

    halign = center
    valign = center

    shadow_passes = 2
}

# ============================================================
# CAMPO DE CONTRASEÑA
# ============================================================

input-field {
    size = 336, 40

    outline_thickness = 4

    dots_size = 0.2
    dots_spacing = 0.25
    dots_fade_time = 200

    outer_color = rgba(b4befeff)
    inner_color = rgba(11111bff)
    font_color = rgba(b4befeff)

    font_family = $fontFamily

    fade_on_empty = false

    placeholder_text =

    rounding = 9

    check_color = rgba(b4befeff)
    fail_color = rgba(f38ba8ff)

    fail_text =

    fail_timeout = 1000
    fail_transition = 200

    position = 0, -100
}

# ============================================================
# BOTÓN DE ENTRADA
# ============================================================

label {
    text = <b></b>

    color = rgba(11111bff)

    font_size = 14
    font_family = $fontFamily

    position = 150, -100

    halign = center
    valign = center

    zindex = 2
}

shape {
    size = 34, 34

    color = rgba(9399b2ff)

    rounding = 6

    position = 148, -100

    halign = center
    valign = center

    zindex = 1
}

shape {
    size = 8, 34

    color = rgba(9399b2ff)

    rounding = 0

    position = 134, -100

    halign = center
    valign = center

    zindex = 1
}

# ============================================================
# MENSAJE DE ERROR
# ============================================================

label {
    text = $FAIL

    color = rgba(f38ba8ff)

    font_size = 12
    font_family = $fontFamily Bold

    position = 0, -150

    halign = center
    valign = center

    shadow_passes = 2
}
