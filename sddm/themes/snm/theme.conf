[General]

# ==========================================
# FONDO
# ==========================================

Background="/usr/share/sddm/themes/snm/fondooo.jpg"
DimBackgroundImage="0.0"
ScaleImageCropped="false"

# ==========================================
# SIN BLUR
# ==========================================

FullBlur="false"
PartialBlur="false"
BlurRadius="0"

# ==========================================
# FORMULARIO
# ==========================================

HaveFormBackground="false"
FormPosition="center"

BackgroundImageHAlignment="center"
BackgroundImageVAlignment="center"

# ==========================================
# CATPPUCCIN / HYPRLAND
# ==========================================

MainColor="#cdd6f4"
AccentColor="#b4befe"
BackgroundColor="#11111b"

# ==========================================
# TIPOGRAFÍA
# ==========================================

Font="Noto Sans"
FontSize="16"

# ==========================================
# INTERFAZ
# ==========================================

InterfaceShadowSize="6"
InterfaceShadowOpacity="0.6"
RoundCorners="20"
ScreenPadding="0"

# ==========================================
# COMPORTAMIENTO
# ==========================================

ForceRightToLeft="false"
ForceLastUser="true"
ForcePasswordFocus="true"
ForceHideCompletePassword="true"
ForceHideVirtualKeyboardButton="true"
ForceHideSystemButtons="true"

AllowEmptyPassword="false"
AllowBadUsernames="false"

# ==========================================
# IDIOMA
# ==========================================

Locale=""

# ==========================================
# RELOJ Y FECHA
# ==========================================

HourFormat="HH:mm"
DateFormat="dddd, d MMMM"

# ==========================================
# TEXTOS
# ==========================================

HeaderText=""

TranslatePlaceholderUsername="Usuario"
TranslatePlaceholderPassword=""
TranslateShowPassword=""

TranslateLogin="Iniciar sesión"
TranslateLoginFailedWarning=""
TranslateCapslockWarning=""

TranslateSession=""

TranslateSuspend=""
TranslateHibernate=""
TranslateReboot=""
TranslateShutdown=""

TranslateVirtualKeyboardButton=""
